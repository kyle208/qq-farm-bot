name: Docker Image CI
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *' # UTC 16:00 = 北京时间 00:00

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      code_changed: ${{ steps.check_change.outputs.CHANGED }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_SYNC }}

      - name: Git config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream fork & detect new commits
        id: check_change
        run: |
          set -euo pipefail
          
          # 1. 先把你自己的 yml 备份到临时目录
          # 注意：这里的路径必须和实际的文件路径完全一致
          cp .github/workflows/docker-image.yml /tmp/my-workflow.yml

          # 2. 添加上游并拉取
          git remote add upstream https://github.com/BUGDey/qq-farm-bot.git || true
          git fetch upstream
          
          LOCAL_HEAD=$(git rev-parse HEAD)
          UPSTREAM_HEAD=$(git rev-parse upstream/main)
          echo "LOCAL_HEAD: $LOCAL_HEAD"
          echo "UPSTREAM_HEAD: $UPSTREAM_HEAD"

          # 3. 核心判断：上游最新的 commit 是否已经在本地历史中
          # 这样即使你本地多了一个 yml 文件，只要上游没更新，就不会触发
          if git merge-base --is-ancestor "$UPSTREAM_HEAD" "$LOCAL_HEAD"; then
            echo "✅ 上游无新提交，跳过同步与构建"
            echo "CHANGED=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "🔔 上游发现新提交，同步代码到 fork 仓库"
          
          # 4. 强制同步上游代码
          git reset --hard upstream/main
          
          # 5. 恢复你的 yml 文件
          mkdir -p .github/workflows
          cp /tmp/my-workflow.yml .github/workflows/docker-image.yml

          # 6. 提交并推送
          git add -A
          git commit -m "chore: sync upstream and restore custom workflow" || echo "无差异需提交"
          
          git remote set-url origin https://${{ secrets.PAT_SYNC }}@github.com/kyle208/qq-farm-bot.git
          git push origin main --force
          
          echo "CHANGED=true" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        if: steps.check_change.outputs.CHANGED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.check_change.outputs.CHANGED == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_change.outputs.CHANGED == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Generate Beijing time tag
        id: meta
        if: steps.check_change.outputs.CHANGED == 'true'
        run: |
          echo "DATE_TAG=$(TZ='Asia/Shanghai' date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        if: steps.check_change.outputs.CHANGED == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./core/Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          pull: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/qq-farm:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/qq-farm:${{ steps.meta.outputs.DATE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
